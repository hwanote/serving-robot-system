# python -m app --config config/fleet.yaml      (command line flags override this file)
mode: C                      # A one robot | B simple dispatch | C cooperative (zones + route check)
adapter: ros                 # ros | fake
robots:                      # one ROS_DOMAIN_ID per robot (TF frames are not prefixed)
  - {name: robot_01, domain: 0}
  - {name: robot_02, domain: 2}
zones:                       # who serves which table first; the other robot helps after help_after_s
  robot_01: [table_01, table_03]
  robot_02: [table_02, table_04]
priorities:                  # bigger is served first (default 0)
  # table_04: 5
stagger_s: 10
help_after_s: 15
idle_home_s: 10
offline_after_s: 5
offline_fail_s: 30
ack_timeout_s: 10
