- ros_topic_name: "/robot_01/cmd_vel"
  gz_topic_name: "/model/robot_01/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot_01/odom"
  gz_topic_name: "/model/robot_01/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/robot_01/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/cafe/model/robot_01/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_01/scan"
  gz_topic_name: "/model/robot_01/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_01/contact"
  # Gazebo ignores <topic> for contact sensors: it publishes on the sensor's
  # scoped name (checked on the VM with gz topic -i).
  gz_topic_name: "/world/cafe/model/robot_01/link/base_footprint/sensor/bumper_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

# Front RGB-D camera (rgbd_camera sensor, 320x240, 120 deg, 10 Hz)
- ros_topic_name: "/robot_01/camera_front/image"
  gz_topic_name: "/model/robot_01/camera_front/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_01/camera_front/depth"
  gz_topic_name: "/model/robot_01/camera_front/depth_image"
